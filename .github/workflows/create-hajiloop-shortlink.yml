name: Create Hajiloop short link

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  shorten:
    runs-on: ubuntu-latest
    steps:
      - name: Create tracked is.gd link
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS --get 'https://is.gd/create.php' \
            --data-urlencode 'format=json' \
            --data-urlencode 'url=https://radiant-fog-grzr56y.shipstatic.com' \
            --data-urlencode 'shorturl=hajiloop_waitlist' \
            --data-urlencode 'logstats=1')
          echo "SHORTLINK_RESPONSE=$response"
