name: Create Hajiloop Spoo link

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  shorten:
    runs-on: ubuntu-latest
    steps:
      - name: Create tracked Hajiloop spoo.me link
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\nHTTP_STATUS:%{http_code}' \
            -X POST 'https://spoo.me/api/v1/shorten' \
            -H 'Content-Type: application/json' \
            --data '{"long_url":"https://hyped-nebula-8b4aw3z.shipstatic.com/?utm_source=instagram&utm_medium=bio&utm_campaign=hajiloop_waitlist","alias":"hajiloop"}')
          echo "$response"
          echo "$response" | grep -q 'HTTP_STATUS:201'
