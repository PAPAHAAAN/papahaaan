name: QA Hajiloop landing patch

on:
  push:
    branches:
      - hajiloop-recover-20260922
    paths:
      - .github/workflows/qa-hajiloop-patch.yml

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Source and contract checks
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("recovered/hajiloop-live")
          html = (root / "index.html").read_text(encoding="utf-8")
          js = (root / "assets/index-BjpDLvoS.js").read_text(encoding="utf-8")
          review = (root / "review-early-access.html").read_text(encoding="utf-8")
          edge = Path("netlify/edge-functions/hajiloop-country-locale.ts").read_text(encoding="utf-8")

          old_offer_patterns = [
              r"3\s*months", r"three\s*months", r"3\s*เดือน", r"สามเดือน",
              r"3\s*bulan", r"tiga\s*bulan",
          ]
          for name, text in [("index", html), ("app-js", js), ("review", review)]:
              for pattern in old_offer_patterns:
                  assert not re.search(pattern, text, re.I), f"{name}: old offer remains: {pattern}"

          required_html = [
              "1 YEAR FREE",
              "Join early. Your first year is on us.",
              "Keep going. Haji connects the dots.",
              "How does the one-year offer work?",
              "first ten waitlist signups receive Hajiloop One",
              'data-geo-locale="en"',
              "/assets/hajiloop-20260922.css",
              'data-waitlist-form',
          ]
          for token in required_html:
              assert token in html, f"missing HTML contract: {token}"

          required_js = [
              "GRATIS 1 TAHUN",
              "ใช้ฟรี 1 ปีเต็ม",
              "Tubuh bicara.",
              "ร่างกายกำลังบอกอะไร?",
              "Lanjut sedikit. Biar semuanya nyambung.",
              "เลื่อนต่ออีกนิด แล้วค่อยดูภาพให้ครบ",
              "Gabung Early Access",
              "เข้าร่วม Early Access",
              "hajiloop_language_v1",
              "document.documentElement.dataset.geoLocale",
              "setTimeout(()=>{o()||(r=!0,c(!0),d())},2e3)",
              "https://bnxkhovipzbmweirqqzk.supabase.co/functions/v1/landing-waitlist",
              "landing_view",
              "waitlist_view",
              "waitlist_start",
              "waitlist_submit",
              "waitlist_success",
              "waitlist_error",
              "G-FLB6SZW93C",
              "yeu0ynx014",
              "early-access-20260922-localized",
          ]
          for token in required_js:
              assert token in js, f"missing JS contract: {token}"

          assert 'country === "TH" ? "th" : country === "ID" ? "id" : "en"' in edge
          assert 'context.geo?.country?.code' in edge
          assert 'path: "/"' in edge

          # Every root-relative asset linked by index must exist in the recovered deploy.
          refs = set(re.findall(r'(?:src|href|srcset)="(/[^"#? ]+)', html))
          for ref in refs:
              if ref in {"/privacy"}:
                  assert (root / "privacy").exists()
                  continue
              if ref.startswith("/assets/"):
                  assert (root / ref.lstrip("/")).exists(), f"missing asset: {ref}"

          print("SOURCE_QA=pass")

      - name: JavaScript syntax check
        shell: bash
        run: |
          node --check recovered/hajiloop-live/assets/index-BjpDLvoS.js

      - name: Browser rendering checks
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium is required for landing QA"
            exit 1
          fi

          ROOT="recovered/hajiloop-live"
          cp "$ROOT/index.html" "$ROOT/qa-th.html"
          cp "$ROOT/index.html" "$ROOT/qa-id.html"
          sed -i 's/<html lang="en" data-geo-locale="en">/<html lang="th" data-geo-locale="th">/' "$ROOT/qa-th.html"
          sed -i 's/<html lang="en" data-geo-locale="en">/<html lang="id" data-geo-locale="id">/' "$ROOT/qa-id.html"

          python3 -m http.server 4173 --directory "$ROOT" >/tmp/hajiloop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          mkdir -p qa/hajiloop-20260922

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2600             --dump-dom http://127.0.0.1:4173/ > /tmp/en-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2600             --dump-dom http://127.0.0.1:4173/qa-th.html > /tmp/th-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2600             --dump-dom http://127.0.0.1:4173/qa-id.html > /tmp/id-dom.html

          grep -q '1 YEAR FREE' /tmp/en-dom.html
          grep -q 'Keep going. Haji connects the dots.' /tmp/en-dom.html
          grep -q 'data-waitlist-ready="true"' /tmp/en-dom.html

          grep -q 'ร่างกายกำลังบอกอะไร' /tmp/th-dom.html
          grep -q 'ใช้ฟรี 1 ปีเต็ม' /tmp/th-dom.html
          grep -q 'เลื่อนต่ออีกนิด แล้วค่อยดูภาพให้ครบ' /tmp/th-dom.html
          grep -q '>EN<' /tmp/th-dom.html

          grep -q 'Tubuh bicara.' /tmp/id-dom.html
          grep -q 'GRATIS 1 TAHUN' /tmp/id-dom.html
          grep -q 'Lanjut sedikit. Biar semuanya nyambung.' /tmp/id-dom.html
          grep -q '>EN<' /tmp/id-dom.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars             --window-size=390,844 --virtual-time-budget=2600             --screenshot=qa/hajiloop-20260922/en-mobile.png http://127.0.0.1:4173/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars             --window-size=390,844 --virtual-time-budget=2600             --screenshot=qa/hajiloop-20260922/th-mobile.png http://127.0.0.1:4173/qa-th.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars             --window-size=390,844 --virtual-time-budget=2600             --screenshot=qa/hajiloop-20260922/id-mobile.png http://127.0.0.1:4173/qa-id.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars             --window-size=1440,1000 --virtual-time-budget=2600             --screenshot=qa/hajiloop-20260922/en-desktop.png http://127.0.0.1:4173/

          rm "$ROOT/qa-th.html" "$ROOT/qa-id.html"
          echo "BROWSER_QA=pass"

      - name: Save QA screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hajiloop Landing"
          git config user.email "actions@users.noreply.github.com"
          git add qa/hajiloop-20260922
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Hajiloop localized landing QA screenshots"
          git push
